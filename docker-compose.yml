services:
  postgres:
    image: postgres:16-alpine
    container_name: fincommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincommerce_password}
      POSTGRES_DB: ${POSTGRES_DB:-fincommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: fincommerce-auth-service
    env_file:
      - .env
    environment:
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://${POSTGRES_USER:-fincommerce}:${POSTGRES_PASSWORD:-fincommerce_password}@postgres:5432/fincommerce_auth?schema=public}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: fincommerce-user-service
    env_file:
      - .env
    environment:
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-3002}
      USER_DATABASE_URL: ${USER_DATABASE_URL:-postgresql://${POSTGRES_USER:-fincommerce}:${POSTGRES_PASSWORD:-fincommerce_password}@postgres:5432/${POSTGRES_DB:-fincommerce}?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  seller-service:
    build:
      context: .
      dockerfile: services/seller-service/Dockerfile
    container_name: fincommerce-seller-service
    env_file:
      - .env
    environment:
      SELLER_SERVICE_PORT: ${SELLER_SERVICE_PORT:-3003}
      SELLER_DATABASE_URL: ${SELLER_DATABASE_URL:-postgresql://${POSTGRES_USER:-fincommerce}:${POSTGRES_PASSWORD:-fincommerce_password}@postgres:5432/fincommerce_seller?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: fincommerce-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  kafka_data:
